name: Build and release plugin JAR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build
        run: gradle clean build --no-daemon
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: RestingMending-1.0.0
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish v1.0.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 build/libs/resting-mending-1.0.0.jar \
            --target "${{ github.sha }}" \
            --title "Resting Mending v1.0.0" \
            --notes "Initial release for Paper 26.3 (Java 25). Sneak and stand still for 1.5 seconds to slowly repair a damaged Mending item in your main hand. Repairs 2 durability per 1 XP every 0.5 seconds, with quiet vanilla XP sounds. Movement, stopping sneak, swapping items, full durability or no XP stop repairs."
